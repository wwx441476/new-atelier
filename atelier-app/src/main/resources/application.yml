server:
  port: 8090

spring:
  application:
    name: new-atelier
  datasource:
    url: jdbc:h2:mem:atelier;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

logging:
  level:
    com.yonyougov.atelier: INFO

# 数据源配置 — 替代 bd-platform DataSourceVO + ConnectionPoolManager
atelier:
  datasources:
    - id: ds-demo
      name: Demo H2
      jdbc-url: jdbc:h2:mem:atelier;DB_CLOSE_DELAY=-1;MODE=MySQL
      username: sa
      password:
      db-type: H2
